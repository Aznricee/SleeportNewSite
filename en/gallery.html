<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleeport Hotel - Gallery</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/icon.png">
    <link rel="stylesheet" href="../style.css">
    <script src="layout.js" defer></script>
    <link rel="canonical" href="https://sleeport.dp.ua/en/gallery.html">
    <link rel="alternate" hreflang="uk" href="https://sleeport.dp.ua/galery.html">
    <link rel="alternate" hreflang="en" href="https://sleeport.dp.ua/en/gallery.html">
    <link rel="alternate" hreflang="x-default" href="https://sleeport.dp.ua/galery.html">
    <meta name="robots" content="index, follow">
    <meta name="description"
        content="Photo gallery of Sleeport Hotel in Dnipro: room interiors, lobby, dining area, and guest amenities.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Photo Gallery — Sleeport Hotel">
    <meta property="og:description"
        content="Discover our hotel spaces and cozy interiors in high-resolution photographs.">
    <meta property="og:url" content="https://sleeport.dp.ua/en/gallery.html">
    <meta property="og:image" content="https://sleeport.dp.ua/images/hotel%20and%20decore/Hall_Yellow2.jpg">
</head>

<body>

    <site-header></site-header>

    <main class="gallery-page">
        <div class="container">

            <header class="page-header">
                <span class="page-eyebrow">PHOTO GALLERY</span>
                <h1 class="page-title" id="gallery-heading">Sleeport Hotel Atmosphere</h1>
                <p class="page-lead" id="gallery-subheading">Explore our rooms, reception area, guest amenities, and hospitality details.</p>
            </header>

            <div class="gallery-filters" id="gallery-filters"></div>

            <div id="gallery-sections-container"></div>

        </div>
    </main>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
        <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
        <div class="lightbox-content">
            <img src="" alt="" class="lightbox-img" id="lightbox-img">
            <div class="lightbox-caption" id="lightbox-caption"></div>
        </div>
    </div>

    <site-footer></site-footer>

    <script>
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        const lightboxCaption = document.getElementById("lightbox-caption");
        const lightboxClose = document.getElementById("lightbox-close");

        function openLightbox(fullUrl, captionText) {
            lightboxImg.src = fullUrl;
            lightboxCaption.textContent = captionText || "";
            lightbox.classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            lightbox.classList.remove("active");
            lightboxImg.src = "";
            document.body.style.overflow = "";
        }

        lightboxClose.addEventListener("click", closeLightbox);
        lightbox.addEventListener("click", (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && lightbox.classList.contains("active")) {
                closeLightbox();
            }
        });

        function getWordDeclension(count) {
            return count === 1 ? "1 photo" : `${count} photos`;
        }

        async function loadGallery() {
            const filtersContainer = document.getElementById("gallery-filters");
            const sectionsContainer = document.getElementById("gallery-sections-container");

            try {
                const response = await fetch("gallery.json");
                if (!response.ok) {
                    throw new Error(`Load error: ${response.status}`);
                }

                const data = await response.json();

                if (data.heading) document.getElementById("gallery-heading").textContent = data.heading;
                if (data.subheading) document.getElementById("gallery-subheading").textContent = data.subheading;
                if (data.pageTitle) document.title = `Sleeport hotel — ${data.pageTitle}`;

                filtersContainer.replaceChildren();
                sectionsContainer.replaceChildren();

                const allBtn = document.createElement("button");
                allBtn.className = "filter-btn active";
                allBtn.dataset.filter = "all";
                allBtn.textContent = "All Photos";
                filtersContainer.appendChild(allBtn);

                (data.categories || []).forEach(cat => {
                    const btn = document.createElement("button");
                    btn.className = "filter-btn";
                    btn.dataset.filter = cat.id;
                    btn.textContent = cat.title;
                    filtersContainer.appendChild(btn);

                    const section = document.createElement("section");
                    section.className = "gallery-category-section";
                    section.dataset.category = cat.id;

                    const headingDiv = document.createElement("div");
                    headingDiv.className = "category-heading";

                    const h2 = document.createElement("h2");
                    h2.textContent = cat.title;

                    const countSpan = document.createElement("span");
                    countSpan.className = "category-count";
                    countSpan.textContent = getWordDeclension((cat.items || []).length);

                    headingDiv.append(h2, countSpan);

                    const grid = document.createElement("div");
                    grid.className = "gallery-grid";

                    const initialLimit = cat.initialVisible || 3;
                    const cardElements = [];

                    (cat.items || []).forEach((item, idx) => {
                        const card = document.createElement("div");
                        card.className = "gallery-card";
                        if (idx >= initialLimit) {
                            card.style.display = "none";
                        }

                        const img = document.createElement("img");
                        img.src = item.preview;
                        img.alt = item.alt || item.title || "";
                        img.loading = "lazy";

                        const caption = document.createElement("span");
                        caption.className = "gallery-card-caption";
                        caption.textContent = item.title;

                        card.append(img, caption);
                        card.addEventListener("click", () => openLightbox(item.full, item.title));

                        grid.appendChild(card);
                        cardElements.push(card);
                    });

                    section.append(headingDiv, grid);

                    if (cardElements.length > initialLimit) {
                        const toggleDiv = document.createElement("div");
                        toggleDiv.className = "toggle-container";

                        const toggleBtn = document.createElement("button");
                        toggleBtn.className = "btn-toggle-more";
                        toggleBtn.textContent = "Show more photos";

                        let isExpanded = false;
                        toggleBtn.addEventListener("click", () => {
                            isExpanded = !isExpanded;
                            cardElements.forEach((card, idx) => {
                                if (idx >= initialLimit) {
                                    card.style.display = isExpanded ? "block" : "none";
                                }
                            });
                            toggleBtn.textContent = isExpanded ? "Show fewer photos" : "Show more photos";
                        });

                        toggleDiv.appendChild(toggleBtn);
                        section.appendChild(toggleDiv);
                    }

                    sectionsContainer.appendChild(section);
                });

                const filterBtns = filtersContainer.querySelectorAll(".filter-btn");
                const sections = sectionsContainer.querySelectorAll(".gallery-category-section");

                filterBtns.forEach(btn => {
                    btn.addEventListener("click", () => {
                        filterBtns.forEach(b => b.classList.remove("active"));
                        btn.classList.add("active");

                        const target = btn.dataset.filter;
                        sections.forEach(section => {
                            if (target === "all" || section.dataset.category === target) {
                                section.style.display = "block";
                            } else {
                                section.style.display = "none";
                            }
                        });
                    });
                });

            } catch (error) {
                console.error(error);
                sectionsContainer.textContent = "Unable to load gallery photos. Please verify gallery.json.";
            }
        }

        document.addEventListener("DOMContentLoaded", loadGallery);
    </script>

</body>

</html>
